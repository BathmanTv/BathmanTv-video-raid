<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vashnik — découpage</title>
<style>
@font-face { font-family: "Barlow Condensed"; src: url(../../production/vashnik-express/assets/fonts/barlow-condensed-700.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Fira Sans"; src: url(../../production/vashnik-express/assets/fonts/fira-sans-400.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Fira Sans"; src: url(../../production/vashnik-express/assets/fonts/fira-sans-500.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: "JetBrains Mono"; src: url(../../production/vashnik-express/assets/fonts/jetbrains-mono.woff2) format("woff2"); font-weight: 100 800; }
:root {
  /* palette du script §2.1 : fond, panneau, cyan = technique, or = danger, une couleur par fontaine */
  --night: #04050F; --panel: #0A0C22; --royal: #08218E; --armor: #1F3FA8; --gem: #3FB8FF;
  --cyan: #7ADBFA; --gold: #D19A45; --marble: #EDE9E1; --muted: #A9B4C7;
  --sang: #8E1B2E; --ombre: #6B3FA0; --flamme: #D1701F;
  /* mêmes teintes, éclaircies pour le texte sur fond nuit */
  --sang-t: #E0566D; --ombre-t: #B08AE8; --flamme-t: #E8893A;
  --title: "Barlow Condensed", sans-serif; --body: "Fira Sans", sans-serif; --mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #222; font-family: var(--body); color: #fff; }
.frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--night); margin-bottom: 40px; }
.abs { position: absolute; }
.t { font-family: var(--title); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: .92; }
.m { font-family: var(--mono); letter-spacing: .16em; text-transform: uppercase; }
.s { color: var(--sang-t); } .o { color: var(--ombre-t); } .f { color: var(--flamme-t); } .c { color: var(--cyan); } .d { color: var(--gold); }
.en { color: var(--muted); font-style: italic; font-weight: 400; }
.studio { position: absolute; inset: 0; background:
  radial-gradient(ellipse 55% 70% at var(--hx, 30%) 42%, rgba(31,63,168,.5), transparent 70%),
  radial-gradient(ellipse 80% 60% at 80% 110%, rgba(8,33,142,.35), transparent 70%),
  linear-gradient(180deg, #060A24, var(--night)); }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(122,219,250,.09) 1.2px, transparent 1.4px); background-size: 32px 32px; mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000, transparent); }
.vign { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.5)); pointer-events: none; }
.char { position: absolute; filter: drop-shadow(0 0 40px rgba(63,184,255,.22)) drop-shadow(0 30px 60px rgba(0,0,0,.6)); }
.tag { position: absolute; right: 24px; bottom: 16px; font: 500 12px var(--mono); letter-spacing: .18em; color: rgba(255,255,255,.6); background: rgba(4,5,15,.8); padding: 5px 10px; border-radius: 3px; z-index: 20; }
.chapter { position: absolute; left: 80px; top: 60px; display: flex; align-items: center; gap: 16px; z-index: 5; }
.chapter .dia { width: 16px; height: 16px; transform: rotate(45deg); background: var(--gem); box-shadow: 0 0 14px var(--gem); }
.chapter .a { font: 700 30px var(--title); letter-spacing: .06em; text-transform: uppercase; }
.chapter .sep { width: 1px; height: 26px; background: rgba(169,180,199,.5); }
.chapter .b { font: 500 16px var(--mono); letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
.prog { display: flex; gap: 5px; margin-left: 10px; } .prog i { width: 20px; height: 4px; background: rgba(169,180,199,.22); } .prog i.on { background: var(--cyan); }
.badge { position: absolute; right: 80px; top: 56px; display: flex; gap: 10px; z-index: 5; }
.pill { font: 600 15px var(--mono); letter-spacing: .2em; padding: 9px 16px; border-radius: 3px; border: 1px solid rgba(169,180,199,.45); color: var(--marble); background: rgba(10,12,34,.75); }
.pill.myth { border-color: var(--cyan); background: linear-gradient(135deg, var(--royal), var(--armor)); box-shadow: 0 0 20px rgba(63,184,255,.35); color: #fff; }
.lower { position: absolute; left: 80px; bottom: 150px; display: flex; background: linear-gradient(90deg, rgba(10,12,34,.94), rgba(10,12,34,.75)); border-bottom: 2px solid var(--gold); box-shadow: 0 18px 40px rgba(0,0,0,.5); z-index: 6; }
.lower .bar { width: 8px; background: linear-gradient(#FFE982, var(--gold)); }
.lower .txt { padding: 14px 24px 14px 20px; }
.lower .n { font: 700 52px var(--title); letter-spacing: .04em; line-height: 1; }
.lower .r { font: 500 14px var(--mono); letter-spacing: .22em; color: var(--muted); margin-top: 6px; }
.wave { display: flex; align-items: center; gap: 4px; padding: 0 22px 0 4px; }
.wave i { width: 4px; border-radius: 2px; background: var(--gem); box-shadow: 0 0 8px rgba(63,184,255,.6); }
.scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 230px; background: linear-gradient(transparent, rgba(4,5,15,.82)); z-index: 6; }
.caption { position: absolute; left: 120px; right: 120px; bottom: 58px; text-align: center; font: 500 38px/1.3 var(--body); text-shadow: 0 2px 10px rgba(0,0,0,.9); z-index: 7; }
.tv { position: absolute; border: 2px solid var(--gold); background: var(--panel); box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: visible; z-index: 4; }
.tv .head { position: absolute; left: -2px; right: -2px; top: -44px; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: linear-gradient(90deg, var(--gold), #9C6E2B); color: var(--night); font: 700 24px var(--title); letter-spacing: .08em; text-transform: uppercase; }
.tv .head .live { width: 12px; height: 12px; border-radius: 50%; background: var(--night); }
.tv .head .r { margin-left: auto; font: 600 14px var(--mono); letter-spacing: .18em; }
.tv .body { position: absolute; inset: 0; overflow: hidden; }
.fields { position: absolute; display: flex; gap: 12px; z-index: 4; }
.fields > div { flex: 1; padding: 14px 18px; background: rgba(10,12,34,.9); border-top: 2px solid var(--cyan); }
.fields .k { font: 500 13px var(--mono); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
.fields .v { font: 500 24px/1.25 var(--body); margin-top: 4px; }
.panel { position: absolute; background: linear-gradient(160deg, rgba(20,28,74,.92), rgba(10,12,34,.94)); border: 1px solid rgba(169,180,199,.25); border-radius: 6px; }
.block { position: absolute; padding: 22px 28px; background: rgba(4,5,15,.86); border-left: 5px solid var(--c, var(--cyan)); font: 500 30px/1.4 var(--body); color: var(--c, var(--cyan)); z-index: 5; }
.block .k { font: 500 13px var(--mono); letter-spacing: .2em; color: var(--muted); margin-bottom: 8px; }
.spell { position: absolute; padding: 18px 22px; background: rgba(10,12,34,.94); border: 1px solid var(--bc, rgba(122,219,250,.5)); border-radius: 6px; z-index: 5; }
.spell .n { font: 700 32px var(--title); text-transform: uppercase; letter-spacing: .03em; color: var(--nc, var(--cyan)); }
.spell .n span { font: italic 400 20px var(--body); color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 8px; }
.spell .v { font: 500 23px/1.4 var(--body); margin-top: 6px; color: var(--marble); }
.spell .v b { font-weight: 500; color: var(--cyan); }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(10,12,34,.85); border: 1px solid rgba(122,219,250,.45); font: 600 15px var(--mono); letter-spacing: .14em; color: var(--cyan); text-transform: uppercase; }
.bigrule { font: 700 88px var(--title); text-transform: uppercase; letter-spacing: .02em; line-height: .95; }
table.recap { border-collapse: collapse; width: 100%; }
table.recap td { padding: 20px 24px; border-bottom: 1px solid rgba(169,180,199,.2); font: 400 25px/1.4 var(--body); vertical-align: top; }
table.recap td:first-child { width: 250px; font: 700 28px var(--title); text-transform: uppercase; letter-spacing: .04em; color: var(--cyan); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const NS = 'http://www.w3.org/2000/svg'
const FC = { S: '#8E1B2E', O: '#6B3FA0', F: '#D1701F' }                    // fontaines (remplissage)
const FT = { S: '#E0566D', O: '#B08AE8', F: '#E8893A' }                    // fontaines (texte)
const FN = { S: 'SANG', O: 'OMBRE', F: 'FLAMME' }
const ANG = { S: -150, O: -30, F: 90 }
const rad = d => d * Math.PI / 180
const pt = (cx, cy, r, a) => [cx + Math.cos(rad(a)) * r, cy + Math.sin(rad(a)) * r]
const SEQ = ['Accroche', 'La salle', 'Les venins', 'Les fontaines', 'Les infections', 'Permanentes', 'Mythique', 'Plan de raid']

/* plan de salle vu de dessus : trois tiers, trois fontaines, la Cavité au centre */
function room(o) {
  const { W, H, R } = o, cx = o.cx ?? W / 2, cy = o.cy ?? H / 2, u = R / 100
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="position:absolute;left:0;top:0;overflow:visible"><defs>`
  for (const f of 'SOF') s += `<radialGradient id="g${f}${o.id}"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="${FT[f]}"/><stop offset="1" stop-color="${FC[f]}"/></radialGradient>`
  s += `<radialGradient id="cav${o.id}"><stop offset="0" stop-color="#1a0d10"/><stop offset=".7" stop-color="#07040a"/><stop offset="1" stop-color="#2a1a08"/></radialGradient>
    <marker id="ar${o.id}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#EDE9E1"/></marker></defs>`
  s += `<circle cx="${cx}" cy="${cy}" r="${R + 6 * u}" fill="#070918" stroke="rgba(169,180,199,.35)" stroke-width="${1.2 * u}"/>`
  for (const f of 'SOF') {                                                  // les tiers
    const a0 = ANG[f] - 60, a1 = ANG[f] + 60, [x0, y0] = pt(cx, cy, R, a0), [x1, y1] = pt(cx, cy, R, a1)
    const on = (o.glow || '').includes(f)
    s += `<path d="M${cx} ${cy}L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${FC[f]}" fill-opacity="${on ? .34 : .17}" stroke="#04050F" stroke-width="${1.5 * u}"/>`
  }
  for (const a of [-90, 30, 150]) { const [x, y] = pt(cx, cy, R, a); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(237,233,225,.18)" stroke-width="${.6 * u}" stroke-dasharray="${2 * u} ${2 * u}"/>` }
  for (const f of 'SOF') {                                                  // les fontaines
    const [x, y] = pt(cx, cy, R * .74, ANG[f]), on = (o.glow || '').includes(f)
    if (on) s += `<circle cx="${x}" cy="${y}" r="${20 * u}" fill="${FT[f]}" fill-opacity=".18" stroke="${FT[f]}" stroke-width="${.8 * u}"/>`
    s += `<circle cx="${x}" cy="${y}" r="${11 * u}" fill="url(#g${f}${o.id})" stroke="#EDE9E1" stroke-opacity=".7" stroke-width="${.8 * u}"/>`
    if (o.labels !== false) { const [lx, ly] = pt(cx, cy, R * .74 + (f === 'F' ? -25 : 21) * u, ANG[f]); s += `<text x="${lx}" y="${ly + 4 * u}" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="${9 * u}" letter-spacing="${.6 * u}" fill="${FT[f]}">${FN[f]}</text>` }
  }
  if (o.drain && o.boss) {                                                  // Absorption : le boss boit
    const [bx, by] = o.boss
    for (const f of o.glow) { const [x, y] = pt(cx, cy, R * .74, ANG[f]); s += `<path d="M${x} ${y}Q${(x + bx) / 2 + (cy - by) * .2} ${(y + by) / 2} ${bx} ${by}" fill="none" stroke="${FT[f]}" stroke-width="${2.2 * u}" stroke-dasharray="${3 * u} ${2.5 * u}" opacity=".9"/>` }
  }
  s += `<circle cx="${cx}" cy="${cy}" r="${14 * u}" fill="url(#cav${o.id})" stroke="#D19A45" stroke-width="${1.2 * u}" stroke-dasharray="${2.5 * u} ${1.8 * u}"/>`
  s += `<circle cx="${cx}" cy="${cy}" r="${19 * u}" fill="none" stroke="#D19A45" stroke-opacity=".35" stroke-width="${.6 * u}"/>`
  if (o.labels !== false && !o.noCavLabel) s += `<text x="${cx}" y="${cy + 29 * u}" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="${4.2 * u}" letter-spacing="${.8 * u}" fill="#D19A45">CAVITÉ MALVEILLANTE</text>`
  for (const v of o.venins || []) {                                         // venins qui rampent vers le centre
    const [fx, fy] = pt(cx, cy, R * .74, ANG[v.f]), ex = cx + (fx - cx) * .22, ey = cy + (fy - cy) * .22
    const x = fx + (ex - fx) * v.t, y = fy + (ey - fy) * v.t
    s += `<line x1="${fx}" y1="${fy}" x2="${x}" y2="${y}" stroke="${FT[v.f]}" stroke-opacity=".55" stroke-width="${1.2 * u}" stroke-dasharray="${1 * u} ${2 * u}"/>`
    s += `<line x1="${x}" y1="${y}" x2="${x + (ex - x) * .45}" y2="${y + (ey - y) * .45}" stroke="#EDE9E1" stroke-width="${1.2 * u}" marker-end="url(#ar${o.id})"/>`
    s += `<circle cx="${x}" cy="${y}" r="${5.5 * u}" fill="${FT[v.f]}" stroke="#fff" stroke-width="${.8 * u}"/>`
    if (v.lab) s += `<text x="${x}" y="${y + 13 * u}" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="${4 * u}" fill="#EDE9E1">${v.lab}</text>`
  }
  for (const t of o.tum || []) {                                            // tumeurs (Mythique)
    const x = cx + t[0] * u, y = cy + t[1] * u, k = 6 * u
    let p = ''; for (let i = 0; i < 16; i++) { const rr = i % 2 ? k * .5 : k; p += `${i ? 'L' : 'M'}${x + Math.cos(i * Math.PI / 8) * rr} ${y + Math.sin(i * Math.PI / 8) * rr}` }
    s += `<path d="${p}Z" fill="#2a1a08" stroke="#D19A45" stroke-width="${1 * u}"/>`
    if (t[2]) s += `<path d="M${x - k} ${y - k}L${x + k} ${y + k}M${x + k} ${y - k}L${x - k} ${y + k}" stroke="#7ADBFA" stroke-width="${1.6 * u}"/>`
  }
  for (const m of o.marked || []) {                                         // joueurs marqués : vagues en croix
    const x = cx + m[0] * u, y = cy + m[1] * u, L = m[2] * u
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) s += `<line x1="${x}" y1="${y}" x2="${x + dx * L}" y2="${y + dy * L}" stroke="#7ADBFA" stroke-opacity=".45" stroke-width="${4 * u}" stroke-linecap="round"/>`
    s += `<circle cx="${x}" cy="${y}" r="${3.6 * u}" fill="#EDE9E1" stroke="#7ADBFA" stroke-width="${1.2 * u}"/>`
  }
  for (const p of o.raid || []) s += `<circle cx="${cx + p[0] * u}" cy="${cy + p[1] * u}" r="${2.6 * u}" fill="#EDE9E1" stroke="#04050F" stroke-width="${.6 * u}"/>`
  s += '</svg>'
  if (o.boss) { const [bx, by] = o.boss, h = (o.bossH || 44) * u; s += `<img src="detourages/gnome-provisoire.png" style="position:absolute;left:${bx - h * .5}px;top:${by - h * .78}px;height:${h}px;filter:drop-shadow(0 0 ${3 * u}px rgba(0,0,0,.9))">` }
  return `<div style="position:absolute;left:${o.x || 0}px;top:${o.y || 0}px;width:${W}px;height:${H}px">${s}</div>`
}
const bossAt = (cx, cy, R, pair) => pt(cx, cy, R * .5, { SO: -90, OF: 30, FS: 150 }[pair])
const blob = (f, r, extra = '') => `<svg width="${r * 2.4}" height="${r * 2.4}" style="overflow:visible"><circle cx="${r * 1.2}" cy="${r * 1.2}" r="${r}" fill="${FT[f]}" stroke="#fff" stroke-width="3"/><circle cx="${r * .85}" cy="${r * .85}" r="${r * .28}" fill="#fff" opacity=".45"/>${extra}</svg>`

// composants
const chapter = (n, sub) => `<div class="chapter"><div class="dia"></div><div class="a">${String(n).padStart(2, '0')} · ${SEQ[n - 1]}</div>${sub ? `<div class="sep"></div><div class="b">${sub}</div>` : ''}<div class="prog">${SEQ.map((_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div></div>`
const badge = () => `<div class="badge"><span class="pill">VASHNIK</span><span class="pill myth">MYTHIQUE</span></div>`
const wave = n => `<div class="wave">${Array.from({ length: n }, (_, i) => `<i style="height:${8 + Math.abs(Math.sin(i * 1.7) * Math.cos(i * .6)) * 32}px"></i>`).join('')}</div>`
const lower = () => `<div class="lower"><div class="bar"></div><div class="txt"><div class="n">GIDEON</div><div class="r">COACH DE RAID</div></div>${wave(16)}</div>`
const caption = html => `<div class="scrim"></div><div class="caption">${html}</div>`
const presenter = (hx = 30) => `<div class="studio" style="--hx:${hx}%"></div><div class="dots"></div><img class="char" src="../../production/vashnik-express/assets/img/gideon.png" style="left:-300px;top:250px;width:1520px;z-index:2">`
const tag = (n, tc, what) => `<div class="tag">PLAN ${String(n).padStart(2, '0')} · ${tc} · ${what}</div>`
const spell = (css, fr, en, v, col) => `<div class="spell" style="${css};${col ? `--bc:${col}88;--nc:${col}` : ''}"><div class="n">${fr}<span>(${en})</span></div><div class="v">${v}</div></div>`

const F = []
// 01 · carton d'intro
F.push(`<img class="abs" src="../../production/vashnik-express/assets/img/diner.png" style="right:0;top:-40px;height:1160px">
  <div class="abs" style="left:0;top:0;width:1300px;height:1080px;background:linear-gradient(90deg,var(--night) 38%,rgba(4,5,15,.6) 70%,transparent)"></div>
  <div class="abs" style="left:110px;top:250px">
    <div class="m c" style="font-size:20px">GUIDE DE BOSS · THE VENOMOUS ABYSS</div>
    <div class="t" style="font-size:210px;margin-top:14px;color:#fff;text-shadow:0 0 60px rgba(63,184,255,.3)">Vashnik</div>
    <div class="t" style="font-size:78px;margin-top:6px;color:var(--muted)">le Malveillant</div>
    <div style="display:flex;gap:12px;margin-top:30px"><span class="pill myth">MYTHIQUE</span><span class="pill">PATCH 12.1</span></div>
    <div style="font:400 28px var(--body);color:#E3E8F2;margin-top:30px">3ᵉ ou 5ᵉ boss selon votre route</div>
  </div>
  <div class="abs" style="left:110px;bottom:90px;display:flex;gap:12px"><span class="chip">Phase unique</span><span class="chip">2 tanks · 4 heals · 14 DPS</span><span class="chip">Héroïsme au pull</span></div>
  ${tag(1, '0:00', 'CARTON D’INTRO')}`)
// 02 · accroche face cam
F.push(`${presenter()}${chapter(1, 'Face cam')}${badge()}
  <div class="tv" style="left:1000px;top:200px;width:840px;height:472px"><div class="head"><span class="live"></span>Guide Mythique<span class="r">GIDEON AU DINER</span></div><div class="body"><img src="../../production/vashnik-express/assets/img/diner.png" style="width:100%;height:100%;object-fit:cover"></div></div>
  <div class="fields" style="left:1000px;top:696px;width:840px"><div><div class="k">Phases</div><div class="v">Unique</div></div><div><div class="k">Composition</div><div class="v">2 · 4 · 14</div></div><div><div class="k">Héroïsme</div><div class="v">Au pull</div></div></div>
  ${lower()}${caption('Il ne demande pas de faire de gros dégâts. Il demande de <span class="c">tenir une rotation</span>.')}
  ${tag(2, '0:10', 'ACCROCHE · FACE CAM')}`)
// 03 · fin de l'accroche
F.push(`<div class="studio" style="--hx:50%"></div><div class="dots"></div>
  <div class="abs" style="left:0;right:0;top:250px;display:flex;justify-content:center;gap:90px">${'SOF'.split('').map(f => `<div style="width:64px;height:64px;transform:rotate(45deg);background:${FT[f]};box-shadow:0 0 40px ${FT[f]}"></div>`).join('')}</div>
  <div class="abs" style="left:0;right:0;top:420px;text-align:center">
    <div class="t" style="font-size:120px">Il y a trois fontaines.</div>
    <div class="t" style="font-size:120px;margin-top:10px">Trois venins.</div>
    <div class="t d" style="font-size:120px;margin-top:10px">Une seule règle.</div>
  </div><div class="vign"></div>
  ${tag(3, '0:55', 'FIN DE L’ACCROCHE')}`)
// 04 · la salle, face cam + encart
F.push(`${presenter()}${chapter(2, 'Face cam + schéma')}${badge()}
  <div class="tv" style="left:1000px;top:200px;width:840px;height:560px"><div class="head"><span class="live"></span>La salle<span class="r">VUE DE DESSUS</span></div><div class="body" style="background:radial-gradient(circle at 50% 50%,#101634,#0A0C22)">${room({ id: 'a', W: 840, H: 560, R: 240 })}</div></div>
  ${lower()}${caption('Une rouge — le <span class="s">Sang</span>. Une violette — l’<span class="o">Ombre</span>. Une orange — la <span class="f">Flamme</span>.')}
  ${tag(4, '1:05', 'LA SALLE · FACE CAM + ENCART')}`)
// 05 · Absorption : le boss boit aux deux fontaines les plus proches
{ const cx = 600, cy = 520, R = 350, b = bossAt(cx, cy, R, 'SO')
F.push(`<div class="studio" style="--hx:32%"></div><div class="dots"></div>${chapter(2, 'Absorption')}${badge()}
  ${room({ id: 'b', W: 1240, H: 1080, R, cx, cy, glow: 'SO', boss: b, drain: true, bossH: 62 })}
  <div class="panel" style="left:1200px;top:170px;width:640px;padding:28px 32px">
